<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<body data-page="entrega">
<div id="app">
  <aside id="sb">
    <div class="logo"><img src="Imagens/esquilo-logo.svg" alt="BeHealthier"></div>
    <a href="index.html"><span><img src="Imagens/icons/casa.svg" alt=""></span>Início</a>
    <a href="receitas.html"><span><img src="Imagens/icons/receitas.svg" alt=""></span>Receitas</a>
    <a href="cardapio.html"><span><img src="Imagens/icons/Calendar_Event.svg" alt=""></span>Cardápio</a>
    <a href="equilibrio.html"><span><img src="Imagens/icons/equilibrio.svg" alt=""></span>Equilíbrio</a>
    <a href="dicas.html"><span><img src="Imagens/icons/lampada.svg" alt=""></span>Dicas</a>
    <a href="entrega.html" class="active"><span><img src="Imagens/icons/entrega.svg" alt=""></span>Entrega <span class="badge cart-count" hidden></span></a>
    <a href="videos.html"><span><img src="Imagens/icons/Play.svg" alt=""></span>Vídeos</a>
    <a href="sobre.html"><span><img src="Imagens/icons/sobre.svg" alt=""></span>Sobre nós</a>
    <div class="user-box"><b class="user-name"></b><span class="user-detail"></span><button data-a="logout" class="user-button"></button></div>
  </aside>
  <div>
    <header id="tb">
      <div class="logo"><img src="Imagens/esquilo-logo.svg" alt="BeHealthier"></div>
      <span class="city-button city-now" data-a="citym"></span>
      <button class="cart-button" data-a="cart"><img src="Imagens/icons/Shopping_Cart_01.svg" alt="" style="width:1.2em;height:1.2em;vertical-align:-.25em"> <span class="cart-count">0</span></button>
    </header>
    <main id="v">
      <div class="page-title"><div><h2>Entrega</h2><p>Simulação de compra e entrega de pratos saudáveis.</p></div><button class="btn" data-a="cart"><img src="Imagens/icons/Shopping_Cart_01.svg" alt="" style="width:1.1em;height:1.1em;vertical-align:-.2em"> Sacola (<span class="cart-count">0</span>)</button></div>
      <div id="trk"></div>
      <div class="three-columns" style="margin-bottom:24px"><button class="city-option" data-a="city" data-k="Joinville"><b><img src="Imagens/icons/localizacao.svg" alt="" style="width:1.1em;height:1.1em;vertical-align:-.2em;filter:brightness(0) opacity(.7)"> Joinville</b><span class="muted-text">Taxa R$ 6,00 · 30–40 min</span></button><button class="city-option" data-a="city" data-k="São Francisco do Sul"><b><img src="Imagens/icons/localizacao.svg" alt="" style="width:1.1em;height:1.1em;vertical-align:-.2em;filter:brightness(0) opacity(.7)"> São Francisco do Sul</b><span class="muted-text">Taxa R$ 9,00 · 45–60 min</span></button><button class="city-option" data-a="city" data-k="Araquari"><b><img src="Imagens/icons/localizacao.svg" alt="" style="width:1.1em;height:1.1em;vertical-align:-.2em;filter:brightness(0) opacity(.7)"> Araquari</b><span class="muted-text">Taxa R$ 8,00 · 40–50 min</span></button></div>
      <div class="panel" style="background:var(--sage-soft);text-align:center"><img src="Imagens/icons/localizacao.svg" alt="" style="width:1.1em;height:1.1em;vertical-align:-.2em;filter:brightness(0) opacity(.7)"> Mapa da região de entrega em breve</div>
      <div class="recipe-grid" id="dishes"></div>
    </main>
  </div>
</div>

  <a href="index.html" class="active"><span><img src="Imagens/icons-preto/casa.svg" alt=""></span>Início</a>

  <a href="#" data-a="more"><span><img src="Imagens/icons-preto/mais.svg" alt=""></span>Mais</a>
</nav>

<div class="toast" id="tt"></div>
