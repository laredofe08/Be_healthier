<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>BeHealthier — Entrar</title>
    <link rel="icon" type="image/svg+xml" href="Imagens/icons/esquilo-logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/receitas-data.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/conta.js" defer></script>
  </head>
  <body data-pagina="login">
    <main class="paginaAutenticacao">
      <div class="bannerAutenticacao">
        <div>
          <div class="logoAutenticacao">
            <a href="index.html" title="Ir para o início" aria-label="BeHealthier — ir para o início">
              <img src="Imagens/icons/esquilo-logo.svg" alt="BeHealthier">
            </a>
          </div>
          <p class="chamadaAutenticacao">Sua conta<br><em>no BeHealthier.</em></p>
          <p>Crie uma conta de demonstração neste navegador.</p>
        </div>
      </div>
      <div class="areaFormularioAutenticacao">
        <section class="caixaAutenticacao">
          <h1 id="tituloAutenticacao">Bem-vindo de volta</h1>
          <div id="areaEntrada">
            <div class="listaOpcoes">
              <button class="botaoOpcao ativo" data-acao="alternarAbaAutenticacao" data-valor="entrar">Entrar</button>
              <button class="botaoOpcao" data-acao="alternarAbaAutenticacao" data-valor="cadastro">Criar conta</button>
            </div>
            <form class="gradeFormulario" id="formularioAutenticacao">
              <label class="somenteCadastro">Nome
                <input name="nome" autocomplete="name">
              </label>
              <label>E-mail
                <input name="email" type="email" required autocomplete="email">
              </label>
              <label>Senha
                <input name="senha" type="password" required autocomplete="current-password">
              </label>
            </form>
            <output id="erroAutenticacao"></output>
            <button class="botao" id="botaoAutenticar" type="submit" form="formularioAutenticacao">Entrar</button>
          </div>
          <button class="botao" id="botaoSair" type="button" hidden>Sair da conta</button>
          <a class="botaoVisitante" href="index.html">Continuar como visitante</a>
        </section>
      </div>
    </main>
    <div class="sobreposicao" id="sobreposicaoModal">
      <div class="caixaModal" id="caixaModalConteudo"></div>
    </div>
    <div class="aviso" id="avisoTemporario"></div>
  </body>
</html>
